services:
  # =============================================================
  # PostgreSQL 16 Database
  # =============================================================
  postgres:
    image: postgres:16-alpine
    container_name: vroom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: vroom_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vroom_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vroom-network

  # =============================================================
  # Redis 7 In-Memory Cache
  # =============================================================
  redis:
    image: redis:7-alpine
    container_name: vroom-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vroom-network

  # =============================================================
  # Backend API (Express + Prisma + TypeScript + Redis Caching)
  # =============================================================
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: vroom-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/vroom_db?schema=public
      JWT_SECRET: ${JWT_SECRET:-vroom_jwt_super_secret_production_key_2026}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-sk_test_mock_paystack_key}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      CACHE_DRIVER: redis
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vroom-network

  # =============================================================
  # Frontend Storefront (React + Vite + Nginx)
  # =============================================================
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5000/api
    container_name: vroom-client
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - server
    networks:
      - vroom-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  vroom-network:
    driver: bridge
